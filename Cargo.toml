[workspace]
resolver = "2"
members = ["core", "net", "dope", "fiber", "gen", "extra", "test"]

[workspace.package]
edition = "2024"
version = "0.11.0"
description = "The manifold runtime"
repository = "https://github.com/dope-rs/dope"
license = "MIT"
authors = ["inq <gofiri@gmail.com>"]

[workspace.dependencies]
dope = { path = "dope", version = "0.11.0" }
dope-core = { path = "core", version = "0.11.0" }
dope-net = { path = "net", version = "0.11.0" }
dope-fiber = { path = "fiber", version = "0.11.0" }
dope-gen = { path = "gen", version = "0.11.0" }
dope-test = { path = "test" }
o3 = "0.7.2"
libc = "0.2"
io-uring = "0.7"
pin-project = "1"
siphasher = "1"
