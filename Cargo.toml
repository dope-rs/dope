[workspace]
resolver = "2"
members = [
    "layer0/core",
    "layer0/kqueue",
    "layer0/sys",
    "layer0/uring",
    "layer1/dope",
    "layer1/manifold",
    "layer1/net",
    "layer1/runtime",
    "layer1/gen",
    "layer2/fiber",
    "layer2/dns",
    "layer2/test",
]
default-members = [
    "layer0/core",
    "layer0/sys",
    "layer1/dope",
    "layer1/manifold",
    "layer1/net",
    "layer1/runtime",
    "layer1/gen",
    "layer2/fiber",
    "layer2/dns",
    "layer2/test",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.30.0"
description = "The manifold runtime"
repository = "https://github.com/dope-rs/dope"
readme = "README.md"
license = "MIT"
authors = ["inq <gofiri@gmail.com>"]

[workspace.dependencies]
dope-test = { path = "layer2/test" }
dope = { path = "layer1/dope", version = "0.30.0" }
dope-core = { path = "layer0/core", version = "0.30.0" }
dope-net = { path = "layer1/net", version = "0.30.0" }
dope-runtime = { path = "layer1/runtime", version = "0.30.0" }
dope-manifold = { path = "layer1/manifold", version = "0.30.0" }
dope-fiber = { path = "layer2/fiber", version = "0.30.0" }
dope-uring = { path = "layer0/uring", version = "0.30.0" }
dope-sys = { path = "layer0/sys", version = "0.30.0" }
dope-kqueue = { path = "layer0/kqueue", version = "0.30.0" }
dope-gen = { path = "layer1/gen", version = "0.30.0" }
engine = { package = "dope", path = "layer1/dope" }
fibers = { package = "dope-fiber", path = "layer2/fiber" }
o3 = "0.33"
libc = "0.2.191"
pin-project = "1.1.13"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full", "visit-mut"] }

[profile.release]
panic = "abort"
