[package]
name = "dope-tls"
version = "0.49.0"
edition = "2024"
rust-version = "1.98"
description = "TCP TLS streams for dope runtime, rustls-backed"
license = "MIT"
repository = "https://github.com/dope-rs/tls"
readme = "README.md"

[lib]
test = false

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
dope = "0.51"
o3 = "0.51"
webpki-roots = "1.0.11"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
dope-fiber = "0.51"
dope-test = "0.51"
pin-project = "1"

[profile.release]
panic = "abort"
