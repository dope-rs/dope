[package]
name = "dope-gen"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Procedural macros for dope"
repository.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
exclude = ["tests"]

[lints]
workspace = true

[lib]
proc-macro = true
test = false

[dependencies]
proc-macro2 = "1"
syn = { version = "3", features = ["full", "visit-mut"] }
quote = "1"

[dev-dependencies]
dope-test.workspace = true
engine = { package = "dope", path = "../dope" }
fibers = { package = "dope-fiber", path = "../../layer2/fiber" }
pin-project.workspace = true
