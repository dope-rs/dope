[package]
name = "dope-gen"
edition.workspace = true
version.workspace = true
description = "Procedural macros for dope"
repository.workspace = true
license.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
syn = { version = "3", features = ["full", "visit-mut"] }
quote = "1"

[dev-dependencies]
dope = { path = "../dope" }
dope-fiber = { path = "../fiber" }
dope-test = { path = "../test" }
o3.workspace = true
pin-project.workspace = true
trybuild = "1"
